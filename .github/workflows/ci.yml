name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  # macOS builds the whole workspace: the client is objc2/CoreFoundation-bound
  # and the host compiles here too (MockInjector stands in for SendInput).
  macos:
    name: Test & clippy (macOS)
    runs-on: macos-latest
    # Without a cap a blocking test pins the runner for the 6-hour default.
    # The suite takes ~3 min locally; 20 leaves room for a cold cache.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      # Formatting is checked once, here — it is platform-independent, so
      # repeating it in the Windows job would only cost time.
      - name: Format
        run: cargo fmt --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Test
        # Single-threaded on purpose: the host package SIGABRTs on roughly
        # half the parallel runs on macOS. Pre-existing, reproduces on a
        # clean main — see docs/known-limitations.md.
        run: cargo test --workspace -- --test-threads=1

  # The Windows-only paths (WindowsInjector, nwg UI, ConPTY, BLE GATT server,
  # and on the client side the WH_KEYBOARD_LL hook, the tray icon and
  # EnumDisplayMonitors) are invisible to a macOS clippy run — cfg-gated code
  # is not even parsed for lints there. This job is the only thing that lints
  # them.
  windows:
    name: Test & clippy (Windows)
    runs-on: windows-latest
    # The client pulls in eframe/wgpu, which is the slow part of this job.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: Clippy (host + client + shared crates)
        run: cargo clippy -p wiredesk-host -p wiredesk-client -p wiredesk-transport -p wiredesk-protocol -p wiredesk-core -p wiredesk-exec-core --all-targets -- -D warnings
      - name: Test (host + client + shared crates)
        run: cargo test -p wiredesk-host -p wiredesk-client -p wiredesk-transport -p wiredesk-protocol -p wiredesk-core -p wiredesk-exec-core

  audit:
    name: cargo audit
    runs-on: ubuntu-latest
    # The action reports findings by creating a check run, which the default
    # read-only GITHUB_TOKEN cannot do — without this the job fails with
    # "Resource not accessible by integration" even when the audit is clean.
    permissions:
      contents: read
      checks: write
    steps:
      - uses: actions/checkout@v4
      # The action runs `cargo audit` with its own flags and does not pick up
      # .cargo/audit.toml, so the ignore list has to be repeated here. Keep
      # the two in sync — audit.toml is what a local `cargo audit` reads, and
      # it carries the reasoning for each entry.
      - uses: rustsec/audit-check@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          ignore: RUSTSEC-2026-0194,RUSTSEC-2026-0195
