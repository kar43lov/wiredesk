[package]
name = "wiredesk-core"
version.workspace = true
edition.workspace = true

[dependencies]
thiserror.workspace = true
serde.workspace = true
bitflags = "2"
log.workspace = true

# CF_HDROP clipboard access (file_clipboard) — the only Windows-specific
# corner of this crate; everything else is pure logic.
